<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmerBadge {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
        transform-origin: center;
      }
      .orb-pulse {
        animation: pulseOrb 6s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-path {
        stroke-dasharray: 20 15;
        animation: flowLine 14s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="140" fill="#0284c7" filter="url(#softGlow)" class="orb-pulse" style="animation-delay: 0s;" />
  <circle cx="1050" cy="300" r="160" fill="#7c3aed" filter="url(#softGlow)" class="orb-pulse" style="animation-delay: -3s;" />
  <circle cx="600" cy="40" r="90" fill="#ec4899" filter="url(#softGlow)" class="orb-pulse" style="animation-delay: -1.5s;" />

  <!-- Animated Decorative Circuit / Flow Lines (Behind text) -->
  <path d="M 50 360 C 300 360, 400 390, 600 380 C 800 370, 950 400, 1150 350" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.4" class="stream-path" />
  <path d="M 80 80 C 260 40, 420 120, 650 70 C 880 20, 980 90, 1120 50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="stream-path" />

  <!-- Floating Decorative Cards (Flanking Sides, Leaving Center Clean) -->
  <g class="floating-card-1">
    <rect x="50" y="160" width="170" height="74" rx="12" fill="#1e293b" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="197" r="14" fill="#0284c7" fill-opacity="0.3" />
    <text x="75" y="202" fill="#38bdf8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📋</text>
    <text x="100" y="191" fill="#f8fafc" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Leave &amp; Time Off</text>
    <text x="100" y="210" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Instant Self-Approval</text>
  </g>

  <g class="floating-card-2">
    <rect x="980" y="150" width="175" height="74" rx="12" fill="#1e293b" fill-opacity="0.65" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="1005" cy="187" r="14" fill="#a855f7" fill-opacity="0.3" />
    <text x="1005" y="192" fill="#c084fc" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">💳</text>
    <text x="1030" y="181" fill="#f8fafc" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Payslips &amp; Tax</text>
    <text x="1030" y="200" fill="#94a3b8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Direct ESS Download</text>
  </g>

  <!-- Central Foreground Content (Solid, Clear, Never Hidden) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="url(#primaryGlow)" stroke-width="1.5" />
    <circle cx="-135" cy="0" r="5" fill="#38bdf8" />
    <text x="5" y="5" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGlow)" letter-spacing="-0.5" filter="url(#glow)">Awesome ESS Portals</text>

  <!-- Secondary Heading / Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">Top Employee Self-Service (ESS) Platforms &amp; Open-Source HRMS</text>

  <!-- Tagline / Description -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    Production-Ready HRIS Self-Service · Automated Payroll Access · Open-Source Alternatives · Enterprise HCM
  </text>

  <!-- Bottom Interactive-Looking Feature Badges -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-255, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">☁️ Cloud SaaS</text>
    </g>

    <!-- Pill 2: Open Source HRMS -->
    <g transform="translate(-85, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="5" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🔓 Self-Hosted OSS</text>
    </g>

    <!-- Pill 3: Payroll & Compliance -->
    <g transform="translate(85, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="5" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📑 Payroll &amp; Tax</text>
    </g>

    <!-- Pill 4: Free Tiers -->
    <g transform="translate(255, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="5" fill="#f472b6" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🎁 Free Tiers &amp; Trials</text>
    </g>
  </g>

  <!-- Bottom Framing Border Indicator -->
  <line x1="200" y1="365" x2="1000" y2="365" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>
